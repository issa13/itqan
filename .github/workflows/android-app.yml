# Builds the إتقان Android app on GitHub's computers — you don't need
# Android Studio for this. Every push to main (or a click on "Run workflow"
# in the Actions tab) produces:
#   • itqan-android-test-apk  → an .apk you can install on any Android phone
#   • itqan-android-play-store → a signed .aab for Google Play (only once you
#     have added the 4 signing secrets — see MOBILE.md, part 5)
# Download them at the bottom of the finished run's page (Actions tab).

name: Android app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "supabase/**"
      - "supabase-schema.sql"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    env:
      ITQAN_VERSION_CODE: ${{ github.run_number }}
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install Capacitor
        run: npm ci

      - name: Copy the website into the app
        run: npm run sync:android

      - name: Build the test APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "itqan-${{ github.run_number }}.apk"

      - name: Upload the test APK
        uses: actions/upload-artifact@v4
        with:
          name: itqan-android-test-apk
          path: mobile/android/itqan-${{ github.run_number }}.apk
          retention-days: 30

      # ---- Google Play build: skipped until the signing secrets exist ----
      - name: Prepare the signing key
        if: env.KEYSTORE_B64 != ''
        working-directory: mobile/android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > itqan-release.jks
          {
            echo "storeFile=itqan-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build the Google Play bundle
        if: env.KEYSTORE_B64 != ''
        working-directory: mobile/android
        run: |
          ./gradlew bundleRelease --no-daemon
          cp app/build/outputs/bundle/release/app-release.aab "itqan-${{ github.run_number }}.aab"

      - name: Upload the Google Play bundle
        if: env.KEYSTORE_B64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: itqan-android-play-store
          path: mobile/android/itqan-${{ github.run_number }}.aab
          retention-days: 30

      - name: Remove the signing key from the build machine
        if: always()
        working-directory: mobile/android
        run: rm -f itqan-release.jks keystore.properties
